name: Tests

on:
  push:
    # WHY feature/**: a push event runs the workflow version carried by the
    # pushed branch itself, so feature branches (this port's `feature/
    # new-worktree`) get CI without waiting for a PR to be opened. PRs to the
    # shipping branches run the head-carried workflow via pull_request below.
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # WHY: a genuine 3.11/3.12 x 3-OS matrix (QA-01/QA-02). fail-fast=false so
      # one platform's red suite does not hide the other platforms' results
      # while the cross-platform port is in flight.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.11', '3.12' ]
        include:
          # WHY: each OS needs a different way to give Qt a display and a
          # different set of collected tests:
          # - Linux: xvfb-run provides the X server; libportaudio2 (apt step
          #   below) provides the PortAudio runtime that sounddevice loads via
          #   ctypes (there is no wheel-bundled copy on Linux).
          # - macOS: the hosted runner has a real window server, so no
          #   xvfb-run is needed (that binary does not even exist on macOS
          #   runners); the macOS-only suites run here and only here.
          # - Windows: QT_QPA_PLATFORM=offscreen (via qt-qpa-platform) gives
          #   Qt a platform plugin without a display server.
          # tests/test_blackhole_installer.py covers the BlackHole macOS
          # installer and tests/test_macos_* exercise the Darwin branches
          # of the platform code, so both belong to the macOS signal and
          # are excluded on Linux/Windows (the Linux/Windows branches are
          # covered by the dedicated port suites).
          # WHY no GPU exclusion list: GPU/CUDA behaviour is NOT validated in
          # CI at all (QA-03 validates it on real hardware manually); the only
          # CUDA-facing tests (test_device_manager.py, test_error_handler.py)
          # mock torch.cuda, so they are safe on CPU-only runners, and the
          # CPU-only wheels plus CUDA_VISIBLE_DEVICES='' below keep any real
          # CUDA path unreachable here.
          # WHY single quotes: they guarantee the glob pattern reaches
          # pytest verbatim. (bash cannot expand the `--ignore-glob=PATTERN`
          # form, since the flag prefix becomes part of the path pattern and
          # matches no directory — but the space-separated
          # `--ignore-glob PATTERN` spelling does expand into the matched
          # files, which pytest would then collect as explicit paths, and
          # nullglob/failglob or other default shells (pwsh on Windows)
          # behave differently again. Quoting is correct for every variant.)
          - os: ubuntu-latest
            test-command: >-
              xvfb-run -a python -m pytest
              --ignore-glob='tests/test_blackhole*.py'
              --ignore-glob='tests/test_macos_*.py'
            qt-qpa-platform: ''
          - os: macos-latest
            test-command: python -m pytest
            qt-qpa-platform: ''
          - os: windows-latest
            test-command: >-
              python -m pytest
              --ignore-glob='tests/test_blackhole*.py'
              --ignore-glob='tests/test_macos_*.py'
            qt-qpa-platform: offscreen

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # WHY: setup-python's pip cache is keyed on OS + Python version + the
        # hashes of the listed dependency files, giving per OS+python caching
        # (important because the torch wheel is hundreds of MB).
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-build.txt
          pytest.ini

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libportaudio2 xvfb libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1


    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install ffmpeg portaudio

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install ffmpeg -y --no-progress
    - name: Install Python dependencies
      shell: bash
      # WHY install torch from the PyTorch CPU index BEFORE requirements.txt:
      # requirements.txt pins torch==2.9.0, and a plain PyPI install on
      # Linux/Windows pulls the CUDA-bundled build (multi-GB nvidia wheels).
      # Seeding the CPU build first makes the requirement already satisfied,
      # so CI never touches a CUDA wheel on any OS (QA-02/QA-03).
      run: |
        python -m pip install --upgrade pip
        python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.0 torchaudio==2.9.0
        python -m pip install -r requirements.txt

    - name: Run tests
      env:
        # WHY: belt-and-braces CPU-only inference — CUDA_VISIBLE_DEVICES=''
        # makes any accidentally-present CUDA stack invisible, so the job
        # proves the CPU fallback path end to end.
        CUDA_VISIBLE_DEVICES: ''
        QT_QPA_PLATFORM: ${{ matrix.qt-qpa-platform }}
      run: ${{ matrix.test-command }} --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
