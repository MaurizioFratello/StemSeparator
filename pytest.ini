[pytest]
# pytest Konfiguration für Stem Separator

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    -p no:warnings
    # WHY: tests/test_screencapture*.py are standalone ScreenCaptureKit
    # diagnostics — they print(), probe the live display and sys.exit(1) at
    # import time, so they are uncollectable on every OS. CI passes the same
    # --ignore-glob explicitly (see .github/workflows/tests.yml).
    --ignore-glob=tests/test_screencapture*.py

# Test paths
testpaths = tests

# WHY a global ceiling: without it a test that blocks (waiting on a subprocess
# or device that never answers on this platform) parks the entire run until the
# CI job times out hours later, with no indication of which test blocked.
timeout = 120
# WHY `thread` and not `signal`: `signal` cannot interrupt code blocked in a C
# call and does not exist on Windows (no SIGALRM), and all three matrix OSes
# must behave identically. Consequence to know: the thread handler dumps the
# stacks of every thread — which names the blocked test — and then ends the
# whole pytest process with os._exit(1). A hang therefore fails the job fast
# and points at the culprit; it does NOT produce a per-test failure line, so a
# blocked test has to be fixed or isolated before the run can go green.
timeout_method = thread


# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    gui: Tests requiring GUI
    audio: Tests with audio files
    network: Tests requiring network

# Coverage options
[coverage:run]
omit =
    tests/*
    */site-packages/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
skip_empty = True
